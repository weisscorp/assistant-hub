name: Development OTA image

on:
  push:
    branches: [main]
    paths:
      - 'backend/dev_ota*.py'
      - 'backend/build_release.py'
      - 'backend/make_release.py'
      - 'backend/test_dev_ota*.py'
      - 'backend/test_release.py'
      - 'deploy/dev-ota/**'
      - '.github/workflows/dev-ota-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-ota-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check OTA and release contracts
        run: python -m unittest discover -s backend -p 'test_dev_ota*.py' -q && python -m unittest discover -s backend -p 'test_release.py' -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server (no APKs or signing keys)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dev-ota/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/weisscorp/assistant-dev-ota:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/weisscorp/assistant-hub
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
