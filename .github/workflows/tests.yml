name: backend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install synthetic audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libspeexdsp1
          python -m pip install -r tools/test-requirements.txt
      - run: python -m unittest discover -s backend -p 'test_*.py' -q
      - run: python tools/benchmark_knowledge.py --facts 1000 --repetitions 5
