[hub]
url = "http://hub:8778"
token_env = "COLLECTOR_HUB_TOKEN"
targets = "auto"

[runtime]
state = "/data/collectors"
workers = 4
max_pending = 1000
retention_days = 7

# Replace this example with your own read-only API. Only selected data is sent.
[[sources]]
id = "service-health"
plugin = "hub_collector_plugins:HttpStatus"
title = "Состояние сервиса"
interval_seconds = 60
timeout_seconds = 15
mode = "changes"
[sources.options]
url = "http://example-service:8080/health"
request_timeout_seconds = 10

