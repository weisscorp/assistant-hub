name: backend tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install synthetic audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libspeexdsp1
          python -m pip install -r tools/test-requirements.txt
      - run: python -m unittest discover -s backend -p 'test_*.py' -q
      - run: python -m unittest discover -s tools -p 'test_check_ghcr_visibility.py' -q
      - run: python tools/benchmark_knowledge.py --facts 1000 --repetitions 5
